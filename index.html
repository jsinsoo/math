<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수학 학습 통합 페이지</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "맑은 고딕", sans-serif;
}

body{
    height:100vh;
    display:flex;
}

/* 왼쪽 20% */
#left-panel{
    width:20%;
    background:linear-gradient(180deg,#1e3c72,#2a5298);
    color:white;
    overflow-y:auto;
    padding:20px;
}

#left-panel h2{
    text-align:center;
    margin-bottom:20px;
    font-size:24px;
}

.menu-btn{
    display:block;
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    background:white;
    color:#1e3c72;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.menu-btn:hover{
    background:#ffd54f;
    transform:scale(1.03);
}

/* 오른쪽 80% */
#right-panel{
    width:80%;
    height:100vh;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>
<body>

<div id="left-panel">
    <h2>📚 수학 메뉴</h2>

    <button class="menu-btn" onclick="loadPage('math01.html')">수학개념</button>
    <button class="menu-btn" onclick="loadPage('math02.html')">고급수학개념</button>
    <button class="menu-btn" onclick="loadPage('math11.html')">수학정리</button>
    <button class="menu-btn" onclick="loadPage('math12.html')">정수론</button>
    <button class="menu-btn" onclick="loadPage('math13.html')">선형대수학</button>
    <button class="menu-btn" onclick="loadPage('math14.html')">현대대수학</button>
    <button class="menu-btn" onclick="loadPage('math15.html')">집합론</button>
    <button class="menu-btn" onclick="loadPage('math16.html')">위상수학</button>
    <button class="menu-btn" onclick="loadPage('math17.html')">실해석학</button>
    <button class="menu-btn" onclick="loadPage('math18.html')">복소해석학</button>

    <button class="menu-btn" onclick="loadPage('math21.html')">미분법</button>
    <button class="menu-btn" onclick="loadPage('math22.html')">적분법</button>
    <button class="menu-btn" onclick="loadPage('math23.html')">고급미적분</button>
    <button class="menu-btn" onclick="loadPage('math24.html')">확률론</button>
    <button class="menu-btn" onclick="loadPage('math25.html')">통계학</button>

    <button class="menu-btn" onclick="loadPage('matoop.html')">행렬</button>
</div>

<div id="right-panel">
    <iframe id="contentFrame" src="math01.html"></iframe>
</div>

<script>
function loadPage(page){
    document.getElementById("contentFrame").src = page;
}
</script>

</body>
</html>
