<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>미적분</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

/* 상단 메뉴 */
#top{
    height:36px;
    padding:4px 8px;
    border-bottom:1px solid #ccc;
    background:#f5f5f5;
    display:flex;
    align-items:center;
    gap:12px;
}

/* 아주 작은 드롭다운 */
#fileSelect{
    width:330px;
    height:24px;
    font-size:12px;
}

#teacherMail{
    font-size:12px;
    font-weight:bold;
    color:#17324d;
    text-decoration:none;
    white-space:nowrap;
}

#teacherMail:hover{
    color:#2f6fa3;
    text-decoration:underline;
}

/* 본문 */
#main{
    width:100%;
    height:calc(100vh - 36px);
    border:none;
}
</style>
</head>

<body>

<div id="top">
    <select id="fileSelect"
            onchange="loadPage(this.value)">
<option value="km01.html">미적분01</option>
<option value="km02.html">미적분02</option>
<option value="km03.html">미적분03</option>
<option value="km04.html">미적분04</option>
<option value="km05.html">미적분05</option>
<option value="km06.html">미적분06</option>
<option value="km07.html">미적분07</option>
<option value="km08.html">미적분08</option>

    </select>

<a id="teacherMail"
   href="https://mail.google.com/mail/?view=cm&fs=1&to=onstar6395@js.hs.kr"
   target="_blank"
   style="font-size:12px;font-weight:bold;text-decoration:none;color:#17324d;">
    📧 선생님 Gmail: onstar6395@js.hs.kr
</a>

</div>

<iframe
    id="main"
    src="km01.html">
</iframe>

<script>
function loadPage(file){
    document.getElementById("main").src = file;
}
</script>

</body>
</html>
